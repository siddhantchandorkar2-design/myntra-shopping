<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>For you, my love ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#25081a;--bg2:#6a1740;--rose:#ff4f93;--gold:#f7d794;--ink:#fff1f6;--soft:#ffc4d9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(130% 90% at 50% 0,var(--bg2),var(--bg1) 72%) fixed var(--bg1);overflow-x:hidden}
.fl{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fl span{position:absolute;bottom:-50px;opacity:0;animation:rise linear forwards}
@keyframes rise{10%{opacity:.75}100%{transform:translate(var(--dx),-115vh) rotate(var(--rot));opacity:0}}
.lock{position:fixed;inset:0;display:grid;place-items:center;z-index:5;padding:20px;transition:opacity 1s,visibility 1s}
.lock.off{opacity:0;visibility:hidden}
.card{width:min(100%,380px);text-align:center;padding:36px 26px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card .h{font-size:58px;display:inline-block;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.card h2{font-family:'Dancing Script',cursive;font-size:34px;color:var(--gold);margin:8px 0 4px}
.card p{color:var(--soft);font-size:15px;margin-bottom:20px}
input{width:100%;padding:14px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.28);color:var(--ink);font:inherit;font-size:16px;text-align:center;outline:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:999px;font:600 16px Nunito,sans-serif;color:#fff;background:linear-gradient(135deg,#ff4f93,#ff7a59);cursor:pointer;box-shadow:0 10px 30px rgba(255,79,147,.4)}
button:disabled{opacity:.6}
.err{min-height:22px;margin:12px 0 0!important;font-size:14px!important;color:#ffd0dd!important}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#main{display:none;position:relative;z-index:2}
#main.show{display:block}
.hero{min-height:100svh;display:grid;align-content:center;justify-items:center;text-align:center;padding:30px 20px;gap:6px}
.pop{opacity:0;animation:pop 1.1s var(--d) cubic-bezier(.2,.9,.3,1.25) forwards}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.7)}to{opacity:1;transform:none}}
.k{font-family:'Dancing Script',cursive;font-size:clamp(34px,9vw,52px);color:var(--soft)}
.big{font-family:'Dancing Script',cursive;font-weight:700;line-height:1;font-size:clamp(66px,20vw,140px);background:linear-gradient(120deg,#fff3c4,#f7d794 40%,#ff7fae);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 8px 10px}
.count{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.count b{font-family:'Dancing Script',cursive;font-size:clamp(60px,16vw,96px);color:var(--rose);font-weight:700}
.count span{font-size:19px;color:var(--soft)}
.sub{font-family:'Dancing Script',cursive;font-size:clamp(30px,8vw,46px);margin-top:14px;line-height:1.25}
.down{margin-top:44px;color:var(--soft);font-size:15px;text-decoration:none;animation:pop 1s var(--d) forwards,bob 2s 4s infinite;opacity:0}
@keyframes bob{50%{transform:translateY(8px)}}
.sec{max-width:640px;margin:0 auto;padding:70px 22px 20px}
.sec h3{font-family:'Dancing Script',cursive;font-size:clamp(40px,11vw,58px);color:var(--gold);text-align:center;margin-bottom:34px}
.gal{display:grid;gap:44px;max-width:380px;margin:auto}
.pol{background:#fff6ef;padding:12px 12px 6px;border-radius:6px;box-shadow:0 22px 50px rgba(0,0,0,.5)}
.pol img{width:100%;display:block;border-radius:3px}
.pol figcaption{font-family:'Dancing Script',cursive;font-size:27px;text-align:center;color:#7a1f48;padding:8px 0 4px}
.rv{opacity:0;transform:translateY(46px) rotate(var(--r,0deg));transition:opacity 1.1s,transform 1.1s}
.rv.in{opacity:1;transform:rotate(var(--r,0deg))}
.lt{padding:20px 22px;margin-bottom:20px;border-radius:18px;line-height:1.85;font-size:17px;background:rgba(255,255,255,.07);border-left:3px solid var(--rose);white-space:pre-line}
.lt.t{font-family:'Dancing Script',cursive;font-size:clamp(30px,8vw,40px);line-height:1.3;color:var(--gold);background:none;border:0;text-align:center}
.end{text-align:center;padding:60px 22px calc(90px + env(safe-area-inset-bottom,0px))}
.end p{font-family:'Dancing Script',cursive;font-size:clamp(38px,10vw,64px);line-height:1.2;background:linear-gradient(120deg,#fff3c4,#ff7fae);-webkit-background-clip:text;background-clip:text;color:transparent}
.end .e{display:block;font-size:50px;margin-top:20px;cursor:pointer;animation:beat 1.6s infinite}
.cf{position:fixed;left:50%;top:45%;z-index:4;pointer-events:none;animation:fly 2.4s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="fl" id="fl"></div>
<div class="lock" id="lock"><div class="card" id="card">
<span class="h">🔒</span><h2>A little surprise for you</h2><p>Type the secret word, my love</p>
<input id="pw" type="password" placeholder="Password" autocomplete="off" autocapitalize="off" aria-label="Password">
<button id="go">Open my gift</button><p class="err" id="err"></p></div></div>
<div id="main">
<section class="hero">
<p class="k pop" style="--d:.3s">Happy</p>
<h1 class="big pop" style="--d:.9s">Six Months</h1>
<div class="count pop" style="--d:1.8s"><b id="n">0</b><span>days of us</span></div>
<p class="sub pop" style="--d:2.8s">Babyyyy my love, my mumma ❤️</p>
<a class="down" style="--d:3.8s" href="#ph">there’s more, scroll down ↓</a>
</section>
<section class="sec" id="ph"><h3>My favourite view</h3><div class="gal" id="gal"></div></section>
<section class="sec"><h3>From my heart</h3><div id="lt"></div></section>
<section class="end rv"><p>Forever grateful that it’s you</p><span class="e" id="hb" title="Tap me">🧿</span></section>
</div>

const $=id=>document.getElementById(id);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:200000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},k,b(D.c))));}
const E=["❤️","💖","💗","🌸","✨","💕"];
function float(){const s=document.createElement("span");s.textContent=E[Math.random()*E.length|0];
s.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*22}px;animation-duration:${7+Math.random()*7}s;--dx:${Math.random()*80-40}px;--rot:${Math.random()*60-30}deg`;
$("fl").appendChild(s);setTimeout(()=>s.remove(),15000);}
setInterval(float,650);for(let i=0;i<6;i++)setTimeout(float,i*150);
function burst(n){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=E[Math.random()*E.length|0];
const a=Math.random()*6.28,r=120+Math.random()*320;
s.style.cssText+=`font-size:${18+Math.random()*24}px;--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-80}px;--rot:${Math.random()*360}deg`;
document.body.appendChild(s);setTimeout(()=>s.remove(),2500);}}
function reveal(){document.querySelectorAll(".rv").forEach(e=>io.observe(e));}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.15});
function build(d){
const caps=["Sunshine suits you ☀️","That smile ✨","My whole heart 🧿"],rs=[-3,2.5,-2];
d.img.forEach((u,i)=>{const f=document.createElement("figure");f.className="pol rv";f.style.setProperty("--r",rs[i%3]+"deg");
f.innerHTML=`<img alt="" src="${u}"><figcaption>${caps[i%3]}</figcaption>`;$("gal").appendChild(f);});
d.msg.forEach((t,i)=>{const p=document.createElement("p");p.className="lt rv"+(i?"":" t");p.textContent=t;$("lt").appendChild(p);});
reveal();}
function count(){const n=$("n"),t0=performance.now()+1800;(function f(t){const p=Math.min(Math.max((t-t0)/2200,0),1);n.textContent=Math.round(183*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);})(performance.now());}
async function open(){
const pw=$("pw").value.trim();if(!pw)return;
if(!window.crypto||!crypto.subtle){$("err").textContent="Please open this link in Chrome or Safari.";return;}
$("go").disabled=true;$("err").textContent="";
try{const d=await dec(pw);build(d);$("lock").classList.add("off");$("main").classList.add("show");
count();burst(50);setTimeout(()=>burst(40),2800);window.scrollTo(0,0);}
catch(e){$("err").textContent="Hmm, that’s not it. Try again, love 💗";const c=$("card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");$("go").disabled=false;}}
$("go").onclick=open;$("pw").onkeydown=e=>{if(e.key==="Enter")open();};
$("hb").onclick=()=>burst(30);
</script>
